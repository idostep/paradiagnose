<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration · Diagnose parasitaire</title>
<style>
:root{--bg:#f1f5f3;--card:#fff;--ink:#14302a;--mut:#5b6d66;--line:#d3dfd8;--acc:#1f6f4a;--ok:#dff3e6;--okb:#2e9e5b;--no:#f9dcdc;--nob:#c93c3c;--warn:#fff3c4;--in:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a16;--card:#17241f;--ink:#e4eee8;--mut:#9db0a8;--line:#2d3f38;--acc:#4cc38a;--ok:#1b3f2c;--okb:#2e9e5b;--no:#4a2323;--nob:#e25b5b;--warn:#4a3d0a;--in:#10201a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0 8px 0 0}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:transparent;color:inherit;padding:6px 12px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bd{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--nob);color:#fff;font-size:12px;text-align:center}
main{max-width:980px;margin:0 auto;padding:14px 16px 60px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);color:inherit;padding:4px 11px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.card.ok{border-left:5px solid var(--okb)}.card.no{border-left:5px solid var(--nob);opacity:.8}.card.new{border-left:5px solid #d99a00}
.meta{color:var(--mut);font-size:12.5px;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
input[type=text],input[type=number],select,textarea{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--in);color:inherit}
input[type=text]{flex:1;min-width:200px}input[type=number]{width:70px}
button.b{font:inherit;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff}button.b.d{border-color:var(--nob);color:var(--nob)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);margin-right:4px}
.tag.r{background:var(--no)}.tag.g{background:var(--ok)}.tag.y{background:var(--warn)}
.cm{margin:3px 0 3px 10px;padding-left:8px;border-left:3px solid var(--line);font-size:14px}
h3{margin:18px 0 4px}.empty{color:var(--mut);padding:20px 0}
.item.h{opacity:.55}.sep{height:1px;background:var(--line);margin:10px 0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none}#toast.on{opacity:1}
</style></head><body>
<header><h1>Administration</h1>
<nav><button data-t="sg">Suggestions <span class="bd" id="bsg" hidden></span></button><button data-t="rp">Signalements <span class="bd" id="brp" hidden></span></button><button data-t="ed">Critères &amp; votes</button></nav>
<span style="flex:1"></span><button class="b" id="out">Se déconnecter</button></header>
<main><section id="sg"></section><section id="rp" hidden></section><section id="ed" hidden></section></main>
<div id="toast"></div>
<script>
let T=''; try{T=sessionStorage.getItem('adm')||''}catch(_){}
const qs=new URLSearchParams(location.search); if(qs.get('token')){T=qs.get('token');try{sessionStorage.setItem('adm',T)}catch(_){};history.replaceState(null,'',location.pathname)}
if(!T){T=prompt('Mot de passe admin')||'';try{sessionStorage.setItem('adm',T)}catch(_){}}
const H=()=>({'X-Admin-Token':T,'Content-Type':'application/json'});
const get=p=>fetch(p,{headers:H()}).then(r=>{if(r.status===403){toast('Accès refusé');throw 0}return r.json()});
const post=(p,d)=>fetch(p,{method:'POST',headers:H(),body:JSON.stringify(d)}).then(r=>{if(r.status===403){toast('Accès refusé');throw 0}return r.json()});
const $=id=>document.getElementById(id);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x==='on')for(const[ev,f]of Object.entries(v))e.addEventListener(ev,f);else e[x]=v}k.flat().forEach(c=>e.append(c));return e};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
const when=ts=>new Date(ts*1000).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const REASONS={'erreur':'Information fausse','pas distinctif':'Pas distinctif','mal classé':'Mal classé','doublon':'Doublon','autre':'Autre'};
$('out').onclick=()=>{try{sessionStorage.removeItem('adm')}catch(_){};location.reload()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
function show(k){['sg','rp','ed'].forEach(x=>$(x).hidden=x!==k);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===k));if(k==='ed'&&!$('ed').dataset.ok)initEd()}
let DATA={suggestions:[],reports:[]},FS='pending',FR='new';
async function load(){DATA=await get('/api/admin/overview');renderSg();renderRp();
 const ps=DATA.suggestions.filter(s=>s.status==='pending').length,nr=new Set(DATA.reports.filter(r=>!r.handled).map(r=>r.key)).size;
 $('bsg').hidden=!ps;$('bsg').textContent=ps;$('brp').hidden=!nr;$('brp').textContent=nr}
/* ---------- suggestions ---------- */
function chips(list,cur,set){return el('div',{class:'bar'},list.map(([k,l,n])=>el('button',{class:'chip'+(cur===k?' on':''),on:{click:()=>set(k)}},l+(n!=null?' ('+n+')':''))))}
function renderSg(){const root=$('sg');root.innerHTML='';const S=DATA.suggestions,c=s=>S.filter(x=>x.status===s).length;
 root.append(el('h3',{},'Suggestions de critères'),chips([['pending','En attente',c('pending')],['approved','Approuvées',c('approved')],['rejected','Refusées',c('rejected')],['all','Toutes',S.length]],FS,k=>{FS=k;renderSg()}));
 const L=S.filter(x=>FS==='all'||x.status===FS);if(!L.length)root.append(el('div',{class:'empty'},'Rien ici.'));
 L.forEach(s=>{const t=el('input',{type:'text',value:s.text}),g=el('select',{},[['a','autre'],['o','œil nu / loupe'],['m','microscope']].map(([v,l])=>el('option',{value:v,textContent:l}))),d=el('input',{type:'checkbox'});
  const card=el('div',{class:'card '+(s.status==='approved'?'ok':s.status==='rejected'?'no':'new')});
  const act=(a,msg)=>async()=>{await post('/api/admin/suggestion',{id:s.id,action:a,text:t.value,grp:g.value,dist:d.checked});toast(msg);load()};
  card.append(el('div',{class:'meta'},'#'+s.id+' · étape ',el('b',{},s.node_name||s.node),' · '+when(s.ts)+' · visiteur '+s.voter+' · ',el('span',{class:'tag '+(s.status==='approved'?'g':s.status==='rejected'?'r':'y')},{pending:'en attente',approved:'visible',rejected:'refusée'}[s.status])),
   el('div',{class:'row'},t),el('div',{class:'row'},'Groupe',g,el('label',{},d,' distinctif')),
   el('div',{class:'row'},s.status!=='approved'?el('button',{class:'b p',on:{click:act('approve','Approuvée : visible pour tous')}},'Approuver'):el('button',{class:'b',on:{click:act('approve','Mis à jour')}},'Enregistrer les modifs'),
    s.status==='approved'?el('button',{class:'b',on:{click:act('reset','Retirée')}},'Retirer'):'',s.status!=='rejected'?el('button',{class:'b d',on:{click:act('reject','Refusée')}},'Refuser'):el('button',{class:'b',on:{click:act('reset','Remise en attente')}},'Remettre en attente'),
    el('button',{class:'b d',on:{click:()=>{if(confirm('Supprimer définitivement ?'))act('delete','Supprimée')()}}},'Supprimer'),
    el('button',{class:'b',on:{click:()=>openNode(s.node)}},'Voir l’étape')));root.append(card)})}
/* ---------- signalements ---------- */
function renderRp(){const root=$('rp');root.innerHTML='';const by={};DATA.reports.forEach(r=>(by[r.key]=by[r.key]||[]).push(r));
 const groups=Object.values(by).map(a=>({a,open:a.some(r=>!r.handled)}));const nOpen=groups.filter(g=>g.open).length;
 root.append(el('h3',{},'Signalements'),chips([['new','À traiter',nOpen],['done','Traités',groups.length-nOpen],['all','Tous',groups.length]],FR,k=>{FR=k;renderRp()}));
 const L=groups.filter(g=>FR==='all'||(FR==='new')===g.open);if(!L.length)root.append(el('div',{class:'empty'},'Rien ici.'));
 L.forEach(({a,open})=>{const r0=a[0],card=el('div',{class:'card '+(open?'new':'ok')});
  const key=r0.key,act=(action,extra={},msg)=>async()=>{await post('/api/admin/report',Object.assign({key,action},extra));toast(msg||'ok');load()};
  const counts={};a.forEach(r=>counts[r.reason]=(counts[r.reason]||0)+1);
  card.append(el('div',{class:'meta'},'étape ',el('b',{},r0.node_name||'?'),r0.item_id?' · 👍 '+r0.u+'  👎 '+r0.d:'',r0.visible===0?' · ':'',r0.visible===0?el('span',{class:'tag r'},'masqué'):''),
   el('div',{style:'font-weight:600;margin:2px 0 6px'},r0.text||key),
   el('div',{},Object.entries(counts).map(([k,n])=>el('span',{class:'tag y'},(REASONS[k]||k)+' × '+n))),
   ...a.map(r=>el('div',{class:'cm'},el('span',{class:'meta'},when(r.ts)+' · '+(REASONS[r.reason]||r.reason)+' · visiteur '+r.voter+(r.handled?' · traité':'')),r.comment?el('div',{},r.comment):'')),
   el('div',{class:'row'},open?el('button',{class:'b p',on:{click:act('handled',{},'Marqué traité')}},'Marquer traité'):el('button',{class:'b',on:{click:act('unhandled',{},'Rouvert')}},'Rouvrir'),
    r0.item_id&&r0.visible!==0?el('button',{class:'b d',on:{click:act('hide_item',{item_id:r0.item_id},'Critère masqué')}},'Masquer le critère'):'',
    r0.item_id&&r0.visible===0?el('button',{class:'b',on:{click:act('show_item',{item_id:r0.item_id},'Critère réaffiché')}},'Réafficher'):'',
    r0.node?el('button',{class:'b',on:{click:()=>openNode(r0.node)}},'Modifier'):'',
    el('button',{class:'b d',on:{click:()=>{if(confirm('Supprimer ces signalements ?'))act('delete',{},'Supprimés')()}}},'Supprimer')));root.append(card)})}
/* ---------- critères & votes ---------- */
const KINDS={tab:'Critères d’identification',moi:'Compléments',note:'Notes',conf:'Confusions'};
let NODES=[];
async function initEd(){const root=$('ed');root.dataset.ok=1;NODES=await get('/api/admin/nodes');root.innerHTML='';
 const sel=el('select',{id:'nsel'},NODES.map(n=>el('option',{value:n.id,textContent:n.t+' ('+n.id+')'})));const f=el('input',{type:'text',placeholder:'Filtrer les étapes…',on:{input:()=>{const v=f.value.toLowerCase();[...sel.options].forEach(o=>o.hidden=!o.textContent.toLowerCase().includes(v));const first=[...sel.options].find(o=>!o.hidden);if(first&&sel.selectedOptions[0].hidden)sel.value=first.value}}});
 root.append(el('h3',{},'Critères et votes'),el('div',{class:'row'},f,sel,el('button',{class:'b p',on:{click:()=>loadItems(sel.value)}},'Ouvrir')),el('div',{id:'nbody'}));sel.onchange=()=>loadItems(sel.value)}
async function openNode(id){show('ed');if(!$('ed').dataset.ok)await initEd();$('nsel').value=id;loadItems(id)}
async function loadItems(id){const d=await get('/api/admin/items?node='+encodeURIComponent(id)),root=$('nbody');root.innerHTML='';
 const ti=el('input',{type:'text',value:d.node.t||''}),bi=el('input',{type:'text',value:d.node.bio||'',placeholder:'hôte / importance'});
 root.append(el('div',{class:'card'},el('div',{class:'meta'},'Étape « '+id+' »'),el('div',{class:'row'},ti,bi,el('button',{class:'b',on:{click:async()=>{await post('/api/admin/node',{id,t:ti.value,bio:bi.value});toast('Étape enregistrée')}}},'Enregistrer'))));
 Object.keys(KINDS).forEach(k=>{root.append(el('h3',{},KINDS[k]));d.items.filter(i=>i.kind===k).forEach(i=>root.append(row(i,k,id)));root.append(row({text:'',grp:'a',dist:0,visible:1},k,id,true))})}
function row(i,k,node,isNew){const card=el('div',{class:'card item'+(i.visible?'':' h')});
 const t=el('input',{type:'text',value:i.text,placeholder:isNew?'Nouveau…':''}),g=el('select',{},[['o','œil nu / loupe'],['m','microscope'],['a','autre']].map(([v,l])=>el('option',{value:v,textContent:l,selected:i.grp===v}))),
  d=el('input',{type:'checkbox',checked:!!i.dist}),v=el('input',{type:'checkbox',checked:!!i.visible});
 const u=el('input',{type:'number',min:0,value:i.u||0}),dd=el('input',{type:'number',min:0,value:i.d||0});
 const r1=el('div',{class:'row'},t);if(k==='tab')r1.append(g,el('label',{},d,' distinctif'));r1.append(el('label',{},v,' visible'));
 card.append(r1);
 if(k==='tab'&&!isNew){card.append(el('div',{class:'row'},el('span',{class:'meta'},'Votes affichés :'),'👍',u,'👎',dd,el('span',{class:'meta'},'(vrais votes : 👍 '+i.real_u+' · 👎 '+i.real_d+(i.dist?' · la page ajoute +3 de départ car distinctif':'')+')'),
   el('button',{class:'b',on:{click:async()=>{await post('/api/admin/votes',{key:i.key,u:+u.value,d:+dd.value});toast('Votes ajustés')}}},'Appliquer'),
   el('button',{class:'b d',on:{click:async()=>{if(confirm('Remettre les votes de ce critère à zéro ?')){await post('/api/admin/votes',{key:i.key,reset:true});toast('Votes remis à zéro');loadItems(node)}}}},'Remise à zéro')))}
 card.append(el('div',{class:'row'},el('button',{class:'b p',on:{click:async()=>{if(!t.value.trim())return;await post('/api/admin/item',{id:i.id,node,kind:k,text:t.value,grp:g.value,dist:d.checked,visible:v.checked});toast(isNew?'Ajouté':'Enregistré');loadItems(node)}}},isNew?'Ajouter':'Enregistrer')));
 return card}
show('sg');load().catch(()=>{});
</script></body></html>
