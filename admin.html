<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF3F0;--card:#FFFFFF;--ink:#14302A;--ink2:#4B5E57;--line:#CFDCD5;--green:#1E6B3C;--green-soft:#DCEBE1;--aca:#9A6A00;--aca-s:#FBF0CF;--red:#B3372F;--red-s:#F8DEDB;--in:#FFFFFF;
 --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#0F1A16;--card:#17241F;--ink:#E4EEE8;--ink2:#A3B5AD;--line:#2D3F38;--green:#6CC48F;--green-soft:#1D3328;--aca:#E7BE58;--aca-s:#33290F;--red:#F29A93;--red-s:#3F1F1D;--in:#10201A}}
*,*::before,*::after{box-sizing:border-box}

button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}

.bd{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--red);color:var(--paper);font-size:12px;text-align:center}

h3{font-family:var(--display);font-weight:700;font-size:21px;margin:18px 0 6px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);padding:5px 12px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink2)}.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card.ok{border-left-color:var(--green)}.card.no{border-left-color:var(--red);opacity:.85}.card.new{border-left-color:var(--aca)}
.meta{color:var(--ink2);font-size:13.5px;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0}
input[type=text],input[type=password],input[type=number],select,textarea{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--in)}
input[type=text]{flex:1;min-width:200px}input[type=number]{width:78px}
input[type=checkbox]{accent-color:var(--green)}
button.b{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
button.b:hover{background:var(--green-soft)}
button.b.p{background:var(--green-soft);border-color:var(--green-soft)}button.b.p:hover{background:var(--green);color:var(--paper);border-color:var(--green)}

.empty{color:var(--ink2);padding:20px 0}.item.h{opacity:.55}.sel{width:18px;height:18px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:99}#toast.on{opacity:1}
#login{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
#login h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0 0 4px}#login p{margin:0 0 12px;color:var(--ink2);font-size:14.5px}
#login input{width:100%;margin:5px 0}#login .err{color:var(--red);min-height:1.3em;font-size:14.5px}
</style></head><body>
<div id="login" hidden><h2>Administration</h2><p>Diagnose parasitaire · accès réservé</p>
<form id="lf"><input type="text" id="lu" placeholder="Identifiant" autocomplete="username" required><input type="password" id="lp" placeholder="Mot de passe" autocomplete="current-password" required>
<div class="err" id="le"></div><button class="b p" style="width:100%">Se connecter</button></form></div>
<div id="app" hidden>
<header class="top"><h1>Administration</h1><span class="who" id="who"></span><button class="b" id="out">Se déconnecter</button></header>
<nav class="tabs"><div class="in"><button data-t="sg">Suggestions <span class="bd" id="bsg" hidden></span></button><button data-t="rp">Signalements <span class="bd" id="brp" hidden></span></button><button data-t="vt">Votes</button><button data-t="ed">Critères</button><button data-t="db">Base de données</button></div></nav>
<main><section id="sg"></section><section id="rp" hidden></section><section id="vt" hidden></section><section id="ed" hidden></section><section id="db" hidden></section></main></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x==='on')for(const[ev,f]of Object.entries(v))e.addEventListener(ev,f);else e[x]=v}k.flat().forEach(c=>e.append(c));return e};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
const HD={'X-Requested-With':'admin','Content-Type':'application/json'};
async function api(p,d){const r=await fetch(p,d===undefined?{headers:HD}:{method:'POST',headers:HD,body:JSON.stringify(d)});
 if(r.status===401){showLogin();throw new Error('login')}if(r.status===403){toast('Action refusée');throw new Error('403')}return r.json()}
const get=p=>api(p),post=api;
const when=ts=>new Date(ts*1000).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const REASONS={'erreur':'Information fausse','pas distinctif':'Pas distinctif','mal classé':'Mal classé','doublon':'Doublon','autre':'Autre'};
/* ---------- connexion ---------- */
function showLogin(msg){$('app').hidden=true;$('login').hidden=false;$('le').textContent=msg||'';$('lu').focus()}
$('lf').onsubmit=async e=>{e.preventDefault();$('le').textContent='';
 const r=await fetch('/api/admin/login',{method:'POST',headers:HD,body:JSON.stringify({username:$('lu').value,password:$('lp').value})});const j=await r.json();
 if(!r.ok){$('le').textContent=j.error||'Erreur';return}$('lp').value='';start(j.user)};
$('out').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST',headers:HD,body:'{}'});showLogin()};
async function boot(){const m=await (await fetch('/api/admin/me')).json();
 if(m.user)return start(m.user);showLogin(m.setup?'':'Aucun compte : lance « python3 server.py adduser TON_NOM » sur le serveur.')}
function start(u){$('login').hidden=true;$('app').hidden=false;$('who').textContent=u;show(CUR||'sg');load()}
/* ---------- onglets ---------- */
let CUR='sg';
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
function show(k){CUR=k;['sg','rp','vt','ed','db'].forEach(x=>$(x).hidden=x!==k);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===k));
 if(k==='ed'&&!$('ed').dataset.ok)initEd();if(k==='vt')loadVotes();if(k==='db')renderDb()}
let DATA={suggestions:[],reports:[]},FS='pending',FR='new',SEL=new Set();
async function load(){DATA=await get('/api/admin/overview');renderSg();renderRp();
 const ps=DATA.suggestions.filter(s=>s.status==='pending').length,nr=new Set(DATA.reports.filter(r=>!r.handled).map(r=>r.key)).size;
 $('bsg').hidden=!ps;$('bsg').textContent=ps;$('brp').hidden=!nr;$('brp').textContent=nr}
function chips(list,cur,set){return el('div',{class:'bar'},list.map(([k,l,n])=>el('button',{class:'chip'+(cur===k?' on':''),on:{click:()=>set(k)}},l+(n!=null?' ('+n+')':''))))}
/* éditeur de likes réutilisable */
function likesEditor(key,u0,d0,realU,realD,after){const u=el('input',{type:'number',min:0,value:u0||0}),d=el('input',{type:'number',min:0,value:d0||0});
 return el('div',{class:'row'},el('span',{class:'meta'},'Votes affichés'),'👍',u,'👎',d,realU!=null?el('span',{class:'meta'},'(vrais : 👍 '+realU+' · 👎 '+realD+')'):'',
  el('button',{class:'b',on:{click:async()=>{await post('/api/admin/votes',{key,u:+u.value,d:+d.value});toast('Votes modifiés');after&&after()}}},'Appliquer'),
  el('button',{class:'b d',on:{click:async()=>{if(confirm('Remettre les votes de ce critère à zéro ?')){await post('/api/admin/votes',{key,reset:true});toast('Votes remis à zéro');after&&after()}}}},'Remise à zéro'))}
/* ---------- suggestions ---------- */
function renderSg(){const root=$('sg');root.innerHTML='';const S=DATA.suggestions,c=s=>S.filter(x=>x.status===s).length;
 root.append(el('h3',{},'Suggestions de critères'),chips([['pending','En attente',c('pending')],['approved','Approuvées',c('approved')],['rejected','Refusées',c('rejected')],['all','Toutes',S.length]],FS,k=>{FS=k;SEL.clear();renderSg()}));
 const L=S.filter(x=>FS==='all'||x.status===FS);
 const cnt=el('span',{class:'meta'},SEL.size?SEL.size+' sélectionnée(s)':'');
 const bulk=a=>async()=>{const ids=[...SEL];if(!ids.length)return toast('Rien de sélectionné');if(a==='delete'&&!confirm('Supprimer définitivement '+ids.length+' suggestion(s) ?'))return;
  await post('/api/admin/suggestion',{ids,action:a});SEL.clear();toast(a==='delete'?'Supprimées':'Modifiées');load()};
 root.append(el('div',{class:'bar'},el('button',{class:'b',on:{click:()=>{L.forEach(s=>SEL.add(s.id));renderSg()}}},'Tout sélectionner'),el('button',{class:'b',on:{click:()=>{SEL.clear();renderSg()}}},'Aucune'),
  el('button',{class:'b d',on:{click:bulk('delete')}},'Supprimer la sélection'),el('button',{class:'b',on:{click:bulk('reject')}},'Refuser la sélection'),cnt,el('span',{style:'flex:1'}),
  el('button',{class:'b d',on:{click:async()=>{if(confirm('Supprimer toutes les suggestions refusées ?')){await post('/api/admin/purge',{what:'rejected'});toast('Refusées supprimées');load()}}}},'Vider les refusées'),
  el('button',{class:'b d',on:{click:async()=>{if(confirm('Supprimer TOUTES les suggestions (les critères déjà approuvés seront masqués) ?')){await post('/api/admin/purge',{what:'all_suggestions'});SEL.clear();toast('Tout supprimé');load()}}}},'Tout supprimer')));
 if(!L.length)root.append(el('div',{class:'empty'},'Rien ici.'));
 L.forEach(s=>{const t=el('input',{type:'text',value:s.text}),g=el('select',{},[['a','autre'],['o','œil nu / loupe'],['m','microscope']].map(([v,l])=>el('option',{value:v,textContent:l}))),d=el('input',{type:'checkbox'});
  const ck=el('input',{type:'checkbox',class:'sel',checked:SEL.has(s.id),on:{change:e=>{e.target.checked?SEL.add(s.id):SEL.delete(s.id);cnt.textContent=SEL.size?SEL.size+' sélectionnée(s)':''}}});
  const card=el('div',{class:'card '+(s.status==='approved'?'ok':s.status==='rejected'?'no':'new')});
  const act=(a,msg)=>async()=>{await post('/api/admin/suggestion',{id:s.id,action:a,text:t.value,grp:g.value,dist:d.checked});toast(msg);load()};
  card.append(el('div',{class:'meta'},ck,' #'+s.id+' · étape ',el('b',{},s.node_name||s.node),' · proposée le ',el('b',{},when(s.ts)),' · visiteur '+s.voter+' · ',el('span',{class:'tag '+(s.status==='approved'?'g':s.status==='rejected'?'r':'y')},{pending:'en attente',approved:'visible',rejected:'refusée'}[s.status])),
   el('div',{class:'row'},t),el('div',{class:'row'},'Groupe',g,el('label',{},d,' distinctif')));
  if(s.key)card.append(likesEditor(s.key,s.u,s.d,s.real_u,s.real_d,load));
  card.append(el('div',{class:'row'},s.status!=='approved'?el('button',{class:'b p',on:{click:act('approve','Approuvée : visible pour tous')}},'Approuver'):el('button',{class:'b',on:{click:act('approve','Mis à jour')}},'Enregistrer les modifs'),
    s.status==='approved'?el('button',{class:'b',on:{click:act('reset','Retirée')}},'Retirer'):'',s.status!=='rejected'?el('button',{class:'b d',on:{click:act('reject','Refusée')}},'Refuser'):el('button',{class:'b',on:{click:act('reset','Remise en attente')}},'Remettre en attente'),
    el('button',{class:'b d',on:{click:()=>{if(confirm('Supprimer définitivement ?'))act('delete','Supprimée')()}}},'Supprimer'),
    el('button',{class:'b',on:{click:()=>openNode(s.node)}},'Voir l’étape')));root.append(card)})}
/* ---------- signalements ---------- */
function renderRp(){const root=$('rp');root.innerHTML='';const by={};DATA.reports.forEach(r=>(by[r.key]=by[r.key]||[]).push(r));
 const groups=Object.values(by).map(a=>({a,open:a.some(r=>!r.handled)}));const nOpen=groups.filter(g=>g.open).length;
 root.append(el('h3',{},'Signalements'),chips([['new','À traiter',nOpen],['done','Traités',groups.length-nOpen],['all','Tous',groups.length]],FR,k=>{FR=k;renderRp()}),
  el('div',{class:'bar'},el('button',{class:'b d',on:{click:async()=>{if(confirm('Supprimer tous les signalements traités ?')){await post('/api/admin/purge',{what:'handled_reports'});toast('Supprimés');load()}}}},'Supprimer les traités')));
 const L=groups.filter(g=>FR==='all'||(FR==='new')===g.open);if(!L.length)root.append(el('div',{class:'empty'},'Rien ici.'));
 L.forEach(({a,open})=>{const r0=a[0],card=el('div',{class:'card '+(open?'new':'ok')});
  const key=r0.key,act=(action,extra={},msg)=>async()=>{await post('/api/admin/report',Object.assign({key,action},extra));toast(msg||'ok');load()};
  const counts={};a.forEach(r=>counts[r.reason]=(counts[r.reason]||0)+1);
  card.append(el('div',{class:'meta'},'étape ',el('b',{},r0.node_name||'?'),r0.visible===0?' · ':'',r0.visible===0?el('span',{class:'tag r'},'masqué'):''),
   el('div',{style:'font-weight:600;margin:2px 0 6px'},r0.text||key),
   el('div',{},Object.entries(counts).map(([k,n])=>el('span',{class:'tag y'},(REASONS[k]||k)+' × '+n))),
   ...a.map(r=>el('div',{class:'cm'},el('span',{class:'meta'},when(r.ts)+' · '+(REASONS[r.reason]||r.reason)+' · visiteur '+r.voter+(r.handled?' · traité':'')),r.comment?el('div',{},r.comment):'')));
  if(r0.item_id)card.append(likesEditor('c'+r0.item_id,r0.u,r0.d,null,null,load));
  card.append(el('div',{class:'row'},open?el('button',{class:'b p',on:{click:act('handled',{},'Marqué traité')}},'Marquer traité'):el('button',{class:'b',on:{click:act('unhandled',{},'Rouvert')}},'Rouvrir'),
    r0.item_id&&r0.visible!==0?el('button',{class:'b d',on:{click:act('hide_item',{item_id:r0.item_id},'Critère masqué')}},'Masquer le critère'):'',
    r0.item_id&&r0.visible===0?el('button',{class:'b',on:{click:act('show_item',{item_id:r0.item_id},'Critère réaffiché')}},'Réafficher'):'',
    r0.node?el('button',{class:'b',on:{click:()=>openNode(r0.node)}},'Modifier'):'',
    el('button',{class:'b d',on:{click:()=>{if(confirm('Supprimer ces signalements ?'))act('delete',{},'Supprimés')()}}},'Supprimer')));root.append(card)})}
/* ---------- votes ---------- */
let VF='';
async function loadVotes(){const root=$('vt');const L=await get('/api/admin/votes');root.innerHTML='';
 const f=el('input',{type:'text',placeholder:'Filtrer (texte ou étape)…',value:VF,on:{input:()=>{VF=f.value;draw()}}});root.append(el('h3',{},'Votes par critère'),el('div',{class:'bar'},f),el('div',{id:'vtl'}));
 function draw(){const box=$('vtl');box.innerHTML='';const q=VF.toLowerCase();const R=L.filter(x=>!q||(x.text||'').toLowerCase().includes(q)||(x.node_name||'').toLowerCase().includes(q));
  if(!R.length)box.append(el('div',{class:'empty'},'Aucun vote.'));
  R.forEach(x=>{box.append(el('div',{class:'card'},el('div',{class:'meta'},'étape ',el('b',{},x.node_name||'?')),el('div',{style:'font-weight:600'},x.text),likesEditor(x.key,x.u,x.d,x.real_u,x.real_d,loadVotes)))})}
 draw()}
/* ---------- critères ---------- */
const KINDS={tab:'Critères d’identification',moi:'Compléments',note:'Notes',conf:'Confusions'};
let NODES=[];
async function initEd(){const root=$('ed');root.dataset.ok=1;NODES=await get('/api/admin/nodes');root.innerHTML='';
 const sel=el('select',{id:'nsel'},NODES.map(n=>el('option',{value:n.id,textContent:n.t+' ('+n.id+')'})));const f=el('input',{type:'text',placeholder:'Filtrer les étapes…',on:{input:()=>{const v=f.value.toLowerCase();[...sel.options].forEach(o=>o.hidden=!o.textContent.toLowerCase().includes(v));const first=[...sel.options].find(o=>!o.hidden);if(first&&sel.selectedOptions[0].hidden)sel.value=first.value}}});
 root.append(el('h3',{},'Critères'),el('div',{class:'row'},f,sel,el('button',{class:'b p',on:{click:()=>loadItems(sel.value)}},'Ouvrir')),el('div',{id:'nbody'}));sel.onchange=()=>loadItems(sel.value)}
async function openNode(id){show('ed');if(!$('ed').dataset.ok)await initEd();$('nsel').value=id;loadItems(id)}
async function loadItems(id){const d=await get('/api/admin/items?node='+encodeURIComponent(id)),root=$('nbody');root.innerHTML='';
 const ti=el('input',{type:'text',value:d.node.t||''}),bi=el('input',{type:'text',value:d.node.bio||'',placeholder:'hôte / importance'});
 root.append(el('div',{class:'card'},el('div',{class:'meta'},'Étape « '+id+' »'),el('div',{class:'row'},ti,bi,el('button',{class:'b',on:{click:async()=>{await post('/api/admin/node',{id,t:ti.value,bio:bi.value});toast('Étape enregistrée')}}},'Enregistrer'))));
 Object.keys(KINDS).forEach(k=>{root.append(el('h3',{},KINDS[k]));d.items.filter(i=>i.kind===k).forEach(i=>root.append(row(i,k,id)));root.append(row({text:'',grp:'a',dist:0,visible:1},k,id,true))})}
function row(i,k,node,isNew){const card=el('div',{class:'card item'+(i.visible?'':' h')});
 const t=el('input',{type:'text',value:i.text,placeholder:isNew?'Nouveau…':''}),g=el('select',{},[['o','œil nu / loupe'],['m','microscope'],['a','autre']].map(([v,l])=>el('option',{value:v,textContent:l,selected:i.grp===v}))),
  d=el('input',{type:'checkbox',checked:!!i.dist}),v=el('input',{type:'checkbox',checked:!!i.visible});
 const r1=el('div',{class:'row'},t);if(k==='tab')r1.append(g,el('label',{},d,' distinctif'));r1.append(el('label',{},v,' visible'));card.append(r1);
 if(k==='tab'&&!isNew){card.append(likesEditor(i.key,i.u,i.d,i.real_u,i.real_d,()=>loadItems(node)));if(i.dist)card.append(el('div',{class:'meta'},'La page ajoute +3 de départ au total affiché (critère distinctif).'))}
 card.append(el('div',{class:'row'},el('button',{class:'b p',on:{click:async()=>{if(!t.value.trim())return;await post('/api/admin/item',{id:i.id,node,kind:k,text:t.value,grp:g.value,dist:d.checked,visible:v.checked});toast(isNew?'Ajouté':'Enregistré');loadItems(node)}}},isNew?'Ajouter':'Enregistrer')));
 return card}
/* ---------- base de données : export / import ---------- */
const BTN='text-decoration:none;display:inline-block;border:1px solid var(--green-soft);border-radius:10px;padding:8px 14px;font-weight:700;background:var(--green-soft);color:var(--ink);margin-right:8px';
function renderDb(){const root=$('db');root.innerHTML='';
