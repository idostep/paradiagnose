<style>
:root{--paper:#EEF3F0;--card:#FFFFFF;--ink:#14302A;--ink2:#4B5E57;--line:#CFDCD5;--green:#1E6B3C;--green-soft:#DCEBE1;--aca:#9A6A00;--aca-s:#FBF0CF;--red:#B3372F;--red-s:#F8DEDB;--in:#FFFFFF;
 --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#0F1A16;--card:#17241F;--ink:#E4EEE8;--ink2:#A3B5AD;--line:#2D3F38;--green:#6CC48F;--green-soft:#1D3328;--aca:#E7BE58;--aca-s:#33290F;--red:#F29A93;--red-s:#3F1F1D;--in:#10201A}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}
header.top{max-width:900px;margin:0 auto;padding:20px 16px 8px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
header.top h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,36px);line-height:1.05;margin:0;letter-spacing:-.01em;flex:1}
header.top .who{color:var(--ink2);font-size:14px}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
nav.tabs .in{max-width:900px;margin:0 auto;display:flex;gap:4px;padding:8px 12px;overflow-x:auto}
nav.tabs button{flex:1 1 auto;border:0;background:transparent;padding:9px 10px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:var(--ink);color:var(--paper)}
.bd{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--red);color:var(--paper);font-size:12px;text-align:center}
main{max-width:900px;margin:0 auto;padding:14px 16px 60px}
h3{font-family:var(--display);font-weight:700;font-size:21px;margin:18px 0 6px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);padding:5px 12px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink2)}.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card.ok{border-left-color:var(--green)}.card.no{border-left-color:var(--red);opacity:.85}.card.new{border-left-color:var(--aca)}
.meta{color:var(--ink2);font-size:13.5px;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0}
input[type=text],input[type=password],input[type=number],select,textarea{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--in)}
input[type=text]{flex:1;min-width:200px}input[type=number]{width:78px}
input[type=checkbox]{accent-color:var(--green)}
button.b,a.b{color:var(--ink);font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
button.b:hover{background:var(--green-soft)}
button.b.p{background:var(--green-soft);border-color:var(--green-soft)}button.b.p:hover{background:var(--green);color:var(--paper);border-color:var(--green)}
button.b.d{color:var(--red);border-color:var(--red)}button.b.d:hover{background:var(--red-s)}
.range{max-width:900px;margin:0 auto;padding:10px 16px 0}.range .in{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}.range input[type=date]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:999px;border:1px solid var(--line);margin-right:4px;white-space:nowrap}
.tag.r{background:var(--red-s);color:var(--red);border-color:var(--red)}.tag.g{background:var(--green-soft);color:var(--green);border-color:var(--green)}.tag.y{background:var(--aca-s);color:var(--aca);border-color:var(--aca)}
.cm{margin:4px 0 4px 10px;padding-left:10px;border-left:3px solid var(--line);font-size:15px}
.empty{color:var(--ink2);padding:20px 0}.item.h{opacity:.55}.sel{width:18px;height:18px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:99}#toast.on{opacity:1}
#login{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
#login h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0 0 4px}#login p{margin:0 0 12px;color:var(--ink2);font-size:14.5px}
#login input{width:100%;margin:5px 0}#login .err{color:var(--red);min-height:1.3em;font-size:14.5px}

<script>
const $=id=>document.getElementById(id);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x==='on')for(const[ev,f]of Object.entries(v))e.addEventListener(ev,f);else e[x]=v}k.flat().forEach(c=>e.append(c));return e};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
const HD={'X-Requested-With':'admin','Content-Type':'application/json'};
async function api(p,d){const r=await fetch(p,d===undefined?{headers:HD}:{method:'POST',headers:HD,body:JSON.stringify(d)});
 if(r.status===401){showLogin();throw new Error('login')}if(r.status===403){toast('Action refusée');throw new Error('403')}return r.json()}
